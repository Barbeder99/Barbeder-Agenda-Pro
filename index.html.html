<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>💈 Barber Agenda Pro</title>

  <!-- Meta etiquetas para PWA e iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barber Agenda">
  <meta name="theme-color" content="#0f0f0f">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: "#D4AF37",
            dark: "#111111",
            card: "#1b1b1b"
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #D4AF37;
      border-radius: 10px;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid rgba(212, 175, 55, .25);
      box-shadow: 0 0 20px rgba(212, 175, 55, .08);
    }

    input, select {
      background: #111;
      color: white;
      font-size: 16px !important; /* Previene el zoom automático de Safari en iOS */
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }
  </style>
</head>

<body class="text-white min-h-screen">

  <!-- Mensaje flotante de notificación -->
  <div id="toast" class="hidden fixed top-5 right-5 bg-green-600 text-white font-bold px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300">
    ¡Cita guardada con éxito!
  </div>

  <div class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- Encabezado -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-4xl md:text-5xl font-black text-gold">💈 Barber Agenda Pro</h1>
        <p class="text-gray-400 mt-1 text-sm md:text-base">Organiza todas tus citas fácilmente.</p>
      </div>
      <div class="text-center md:text-right">
        <div id="clock" class="text-2xl font-bold text-gold">00:00</div>
        <div id="today" class="text-gray-400 text-sm"></div>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-6">

      <!-- Formulario Nueva Cita -->
      <div class="card rounded-xl p-5 md:p-6 h-fit">
        <h2 class="text-2xl mb-4 font-bold">➕ Nueva cita</h2>
        <form id="formCita" onsubmit="guardarCita(event)" class="space-y-4">
          <input id="nombre" required type="text" placeholder="👤 Nombre del cliente" class="w-full p-3 rounded border border-gray-800 focus:border-yellow-500 outline-none">
          <input id="telefono" required type="tel" placeholder="📱 Celular (Ej: 912345678)" class="w-full p-3 rounded border border-gray-800 focus:border-yellow-500 outline-none">
          
          <select id="servicio" required class="w-full p-3 rounded border border-gray-800 focus:border-yellow-500 outline-none">
            <option value="">💈 Seleccionar Servicio</option>
            <option value="Corte de cabello">Corte de cabello</option>
            <option value="Corte de cabello + barba">Corte de cabello + barba</option>
            <option value="Diseños">Diseños</option>
            <option value="Cejas">Cejas</option>
          </select>

          <input id="fecha" required type="date" class="w-full p-3 rounded border border-gray-800 focus:border-yellow-500 outline-none">
          <input id="hora" required type="time" class="w-full p-3 rounded border border-gray-800 focus:border-yellow-500 outline-none">

          <button type="submit" class="w-full bg-gold hover:bg-yellow-500 text-black font-bold rounded p-3 transition cursor-pointer active:scale-95">
            💾 Guardar cita
          </button>
        </form>
      </div>

      <!-- Lista de Citas & Estadísticas -->
      <div class="lg:col-span-2 space-y-6">
        <div class="card rounded-xl p-5 md:p-6">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-5">
            <h2 class="text-2xl font-bold">📅 Agenda</h2>
            <div id="contadorCitas" class="text-gold font-bold">0 citas</div>
          </div>

          <!-- Buscador -->
          <div class="mb-5">
            <input id="inputBuscador" type="text" onkeyup="renderizar()" placeholder="🔍 Buscar cliente, celular o servicio..." class="w-full p-3 rounded bg-black text-white border border-yellow-500/40 focus:border-yellow-500 outline-none">
          </div>

          <!-- Contenedor Citas -->
          <div id="listaCitas" class="space-y-4">
            <div class="text-center text-gray-500 py-10">No hay citas registradas.</div>
          </div>
        </div>

        <!-- Estadísticas -->
        <div class="grid md:grid-cols-2 gap-4">
          <div class="card rounded-xl p-4 text-center">
            <h2 class="text-gold text-xl font-bold">📅 Citas para Hoy</h2>
            <p id="statHoy" class="text-3xl font-bold mt-1">0</p>
          </div>
          <div class="card rounded-xl p-4 text-center">
            <h2 class="text-gold text-xl font-bold">📋 Total Histórico</h2>
            <p id="statTotal" class="text-3xl font-bold mt-1">0</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Editar Cita -->
  <div id="modal" class="modal">
    <div class="card rounded-xl p-6 w-full max-w-lg mx-4">
      <h2 class="text-2xl font-bold mb-5">✏️ Editar cita</h2>
      <form id="formEditar" onsubmit="guardarEdicion(event)" class="space-y-4">
        <input id="editId" type="hidden">
        <input id="editNombre" required class="w-full p-3 rounded" placeholder="Nombre">
        <input id="editTelefono" required class="w-full p-3 rounded" placeholder="Celular">
        
        <select id="editServicio" required class="w-full p-3 rounded">
          <option value="Corte de cabello">Corte de cabello</option>
          <option value="Corte de cabello + barba">Corte de cabello + barba</option>
          <option value="Diseños">Diseños</option>
          <option value="Cejas">Cejas</option>
        </select>

        <input id="editFecha" type="date" required class="w-full p-3 rounded">
        <input id="editHora" type="time" required class="w-full p-3 rounded">

        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 bg-gold hover:bg-yellow-500 text-black rounded p-3 font-bold transition">
            Guardar Cambios
          </button>
          <button type="button" onclick="cerrarModal()" class="flex-1 bg-red-600 hover:bg-red-700 rounded p-3 font-bold transition">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let citas = [];

    // --- Cargar y Guardar Datos ---
    function cargarStorage() {
      try {
        const datos = localStorage.getItem("barber_citas_v2");
        if (datos) {
          citas = JSON.parse(datos);
        }
      } catch (err) {
        console.warn("Acceso a LocalStorage restringido. Trabajando en memoria de sesión.", err);
      }
    }

    function guardarStorage() {
      try {
        localStorage.setItem("barber_citas_v2", JSON.stringify(citas));
      } catch (err) {
        console.warn("No se pudo escribir en LocalStorage.", err);
      }
    }

    // --- Notificación flotante ---
    function mostrarNotificacion(mensaje) {
      const toast = document.getElementById("toast");
      toast.innerText = mensaje;
      toast.classList.remove("hidden");

      setTimeout(() => {
        toast.classList.add("hidden");
      }, 3000);
    }

    // --- Reloj en Tiempo Real ---
    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById("clock").innerText = ahora.toLocaleTimeString("es-CL");
      document.getElementById("today").innerText = ahora.toLocaleDateString("es-CL", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // --- Sanitizar HTML ---
    function sanitizar(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // --- Crear Cita ---
    function guardarCita(e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const servicio = document.getElementById("servicio").value;
      const fecha = document.getElementById("fecha").value;
      const hora = document.getElementById("hora").value;

      if (!nombre || !telefono || !servicio || !fecha || !hora) {
        alert("Por favor completa todos los campos del formulario.");
        return;
      }

      const nuevaCita = {
        id: Date.now(),
        nombre: nombre,
        telefono: telefono,
        servicio: servicio,
        fecha: fecha,
        hora: hora
      };

      citas.push(nuevaCita);
      guardarStorage();
      renderizar();

      document.getElementById("formCita").reset();
      mostrarNotificacion("¡Cita guardada correctamente!");
    }

    // --- Enviar Recordatorio (Optimizado para iOS WhatsApp) ---
    function enviarRecordatorio(id) {
      const cita = citas.find(c => c.id === id);
      if (!cita) return;

      const numLimpio = cita.telefono.replace(/\D/g, "");
      
      const textoMensaje = `💈 *RECORDATORIO DE CITA - BARBEDER* 💈\n\n` +
        `Hola *${cita.nombre}*, te recuerdo que tienes una cita agendada para hoy en pocas horas:\n\n` +
        `✂️ *Servicio:* ${cita.servicio}\n` +
        `🕒 *Hora:* ${cita.hora} hrs\n\n` +
        `Por favor, *confirma tu asistencia* o indícame si necesitas reagendar. Recuerda reagendar con anticipación. ¡Nos Vemos! 🔥`;

      const mensajeCodificado = encodeURIComponent(textoMensaje);
      
      // Enlace universal compatible con iOS
      const urlWhatsApp = `https://api.whatsapp.com/send?phone=56${numLimpio}&text=${mensajeCodificado}`;
      
      window.location.href = urlWhatsApp;
    }

    // --- Renderizar Lista de Citas ---
    function renderizar() {
      const lista = document.getElementById("listaCitas");
      const contador = document.getElementById("contadorCitas");
      const filtro = document.getElementById("inputBuscador").value.toLowerCase().trim();

      const ordenadas = [...citas].sort((a, b) => (a.fecha + " " + a.hora).localeCompare(b.fecha + " " + b.hora));

      const filtradas = ordenadas.filter(c =>
        c.nombre.toLowerCase().includes(filtro) ||
        c.servicio.toLowerCase().includes(filtro) ||
        c.telefono.includes(filtro)
      );

      contador.innerText = `${citas.length} citas`;

      const hoyStr = new Date().toISOString().slice(0, 10);
      const citasHoyCount = citas.filter(c => c.fecha === hoyStr).length;
      document.getElementById("statHoy").innerText = citasHoyCount;
      document.getElementById("statTotal").innerText = citas.length;

      if (filtradas.length === 0) {
        lista.innerHTML = `
          <div class="text-center text-gray-500 py-10">
            ${filtro ? 'No se encontraron citas con ese criterio de búsqueda.' : 'No hay citas registradas.'}
          </div>
        `;
        return;
      }

      lista.innerHTML = "";

      filtradas.forEach(item => {
        const numLimpio = item.telefono.replace(/\D/g, "");
        const card = document.createElement("div");
        card.className = "card rounded-xl p-4 md:p-5 flex flex-col md:flex-row justify-between gap-4 items-start md:items-center";

        card.innerHTML = `
          <div class="space-y-1 w-full md:w-auto">
            <h3 class="text-xl font-bold text-gold">👤 ${sanitizar(item.nombre)}</h3>
            <p class="text-gray-300 text-sm md:text-base">📱 ${sanitizar(item.telefono)}</p>
            <p class="text-gray-300 text-sm md:text-base">💈 ${sanitizar(item.servicio)}</p>
            <p class="text-gray-300 text-sm md:text-base">📅 ${item.fecha} &nbsp;|&nbsp; 🕒 ${item.hora}</p>
          </div>

          <div class="flex flex-wrap md:flex-nowrap gap-2 w-full md:w-auto pt-2 md:pt-0">
            <button onclick="enviarRecordatorio(${item.id})" type="button" class="bg-yellow-600 hover:bg-yellow-500 text-black font-bold px-3 py-2 rounded transition flex-1 md:flex-none text-center active:scale-95">
              🔔 Recordar
            </button>
            <a href="https://api.whatsapp.com/send?phone=56${numLimpio}" target="_self" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded font-bold transition flex-1 md:flex-none text-center active:scale-95">
              📲 Chat
            </a>
            <button onclick="abrirEditar(${item.id})" type="button" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded transition active:scale-95">
              ✏️
            </button>
            <button onclick="eliminarCita(${item.id})" type="button" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded transition active:scale-95">
              🗑️
            </button>
          </div>
        `;

        lista.appendChild(card);
      });
    }

    // --- Acciones de Edición y Borrado ---
    function abrirEditar(id) {
      const cita = citas.find(c => c.id === id);
      if (!cita) return;

      document.getElementById("editId").value = cita.id;
      document.getElementById("editNombre").value = cita.nombre;
      document.getElementById("editTelefono").value = cita.telefono;
      document.getElementById("editServicio").value = cita.servicio;
      document.getElementById("editFecha").value = cita.fecha;
      document.getElementById("editHora").value = cita.hora;

      document.getElementById("modal").classList.add("show");
    }

    function cerrarModal() {
      document.getElementById("modal").classList.remove("show");
    }

    function guardarEdicion(e) {
      e.preventDefault();

      const id = Number(document.getElementById("editId").value);
      const idx = citas.findIndex(c => c.id === id);

      if (idx !== -1) {
        citas[idx].nombre = document.getElementById("editNombre").value.trim();
        citas[idx].telefono = document.getElementById("editTelefono").value.trim();
        citas[idx].servicio = document.getElementById("editServicio").value;
        citas[idx].fecha = document.getElementById("editFecha").value;
        citas[idx].hora = document.getElementById("editHora").value;

        guardarStorage();
        renderizar();
        cerrarModal();
        mostrarNotificacion("¡Cita actualizada correctamente!");
      }
    }

    function eliminarCita(id) {
      if (!confirm("¿Seguro que deseas eliminar esta cita?")) return;

      citas = citas.filter(c => c.id !== id);
      guardarStorage();
      renderizar();
      mostrarNotificacion("Cita eliminada.");
    }

    window.onclick = function (e) {
      const modal = document.getElementById("modal");
      if (e.target === modal) {
        cerrarModal();
      }
    };

    // --- Inicialización ---
    cargarStorage();
    renderizar();
  </script>
</body>
</html>
